<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai aur code | DOM </title>
</head>
<body style="background-color: #212121; color: #fff;">
    <ul class="language">
        <li>Javascript</li>
    </ul>
</body>
<script>
    function addLanguage(languageName){
        const li = document.createElement('li');
        li.innerHTML = `${languageName}`
        document.querySelector('.language').
        appendChild(li)
    }
    addLanguage("python")
    addLanguage("typescript")

    //both way 1st is innerhtml and 2nd is using append

    function addOptiLanguage(languageName){
        const li = document.createElement('li');
        li.appendChild(document.createTextNode(languageName))
        document.querySelector('.language').appendChild(li)
    }
    addOptiLanguage('php')

    //Edit
    const secondlanguage = document.querySelector("li:nth-child(2)")
    //secondlanguage.innerHTML = "Mojo"
    const newli = document.createElement('li')
    newli.textContent = "Mojo"
    secondlanguage.replaceWith(newli)

    //edit
    const firstlanguage = document.querySelector("li:first-child")
    firstlanguage.outerHTML = '<li>Typescript</li>'

    //remove
    const lastlanguage = document.querySelector('li:last-child')
    lastlanguage.remove()

</script>
</html>
